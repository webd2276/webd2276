<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Digital Waves developer terminal</title>
  <desc id="desc">3D-style terminal dashboard showing Hamza Qadeer’s role and focus areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#071008"/>
      <stop offset="50%" stop-color="#0c120d"/>
      <stop offset="100%" stop-color="#09110a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111b13"/>
      <stop offset="100%" stop-color="#0b110d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0%" stop-color="#1d3127"/>
      <stop offset="100%" stop-color="#0a140b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="76" y="30" width="1048" height="560" rx="28" fill="#040a05" opacity="0.72"/>
  <g filter="url(#shadow)">
    <rect x="98" y="52" width="1004" height="504" rx="22" fill="url(#panel)" stroke="#1a251c" stroke-width="2"/>
    <path d="M98 96h1004" stroke="#1a251c" stroke-width="2"/>
    <path d="M98 96l0 16" stroke="#1a251c" stroke-width="2"/>
    <path d="M1102 96l0 16" stroke="#1a251c" stroke-width="2"/>
    <rect x="98" y="52" width="1004" height="38" rx="22" fill="#101710"/>
    <circle cx="136" cy="71" r="6" fill="#ff6b6b"/>
    <circle cx="158" cy="71" r="6" fill="#ffd166"/>
    <circle cx="180" cy="71" r="6" fill="#00ff66"/>
    <text x="238" y="77" fill="#667166" font-family="monospace" font-size="16">digital-waves / system-terminal</text>
  </g>

  <g opacity="0.24">
    <path d="M0 430C120 360 220 360 340 430S560 500 680 430 900 360 1200 430V620H0Z" fill="#00ff66"/>
  </g>
  <ellipse cx="885" cy="175" rx="245" ry="170" fill="url(#glow)"/>

  <g font-family="monospace">
    <text x="160" y="156" fill="#00ff66" font-size="20">hamza@digital-waves:~$</text>
    <text x="460" y="156" fill="#f2f7f2" font-size="20">whoami</text>
    <text x="160" y="212" fill="#7cffaa" font-size="28" font-weight="700">&gt; Hamza Qadeer</text>

    <text x="160" y="286" fill="#00ff66" font-size="20">hamza@digital-waves:~$</text>
    <text x="460" y="286" fill="#f2f7f2" font-size="20">role</text>
    <text x="160" y="334" fill="#a5b0a6" font-size="24">&gt; WordPress Developer</text>
    <text x="160" y="370" fill="#a5b0a6" font-size="24">&gt; AI Automation Specialist</text>

    <text x="160" y="440" fill="#00ff66" font-size="20">hamza@digital-waves:~$</text>
    <text x="460" y="440" fill="#f2f7f2" font-size="20">focus</text>
    <text x="160" y="488" fill="#a5b0a6" font-size="24">&gt; WordPress / WooCommerce / React</text>
    <text x="160" y="524" fill="#a5b0a6" font-size="24">&gt; n8n / AI agents / API systems</text>
  </g>

  <g>
    <rect x="840" y="180" width="210" height="170" rx="16" fill="#0b120c" stroke="#1a251c"/>
    <rect x="865" y="205" width="160" height="18" rx="9" fill="#111711"/>
    <rect x="865" y="233" width="115" height="10" rx="5" fill="#00ff66" opacity="0.7"/>
    <rect x="865" y="258" width="146" height="10" rx="5" fill="#1a251c"/>
    <rect x="865" y="283" width="120" height="10" rx="5" fill="#1a251c"/>
    <text x="865" y="332" fill="#7cffaa" font-family="monospace" font-size="16">STATUS </text>
    <text x="953" y="332" fill="#00ff66" font-family="monospace" font-size="16">● AVAILABLE</text>
  </g>
</svg>

